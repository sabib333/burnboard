<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a0a00"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4d00"/>
      <stop offset="50%" style="stop-color:#ff6b2b"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="240" height="240" fill="url(#bg)" rx="48"/>
  
  <!-- Subtle grid dots -->
  <g fill="#1a1a1a" opacity="0.5">
    <circle cx="30" cy="30" r="1.5"/>
    <circle cx="60" cy="30" r="1.5"/>
    <circle cx="90" cy="30" r="1.5"/>
    <circle cx="120" cy="30" r="1.5"/>
    <circle cx="150" cy="30" r="1.5"/>
    <circle cx="180" cy="30" r="1.5"/>
    <circle cx="210" cy="30" r="1.5"/>
    <circle cx="30" cy="60" r="1.5"/>
    <circle cx="60" cy="60" r="1.5"/>
    <circle cx="90" cy="60" r="1.5"/>
    <circle cx="120" cy="60" r="1.5"/>
    <circle cx="150" cy="60" r="1.5"/>
    <circle cx="180" cy="60" r="1.5"/>
    <circle cx="210" cy="60" r="1.5"/>
  </g>
  
  <!-- Fire emoji -->
  <text x="120" y="145" font-size="120" text-anchor="middle" dominant-baseline="central">🔥</text>
  
  <!-- Text -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">BURNBOARD</text>
</svg>
